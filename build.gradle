plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.1.8"
    id 'net.neoforged.moddev' version '2.0.141'
    id "me.modmuss50.mod-publish-plugin" version "2.2.0"
    id "dev.ftb.plugins.ashwing" version "0.2.2"
}

ashwing {
    modName = "FTB Promoter"
    modId = project.mod_id

    publishing {
        curseForgeToken = providers.environmentVariable("CURSEFORGE_KEY").getOrNull()

        forClientAndServer()
        releaseFromString(providers.environmentVariable("TAG").getOrElse(""))
        minecraftVersion(project.minecraft_version)

        withMaven()

        modProject {
            fileFromTask(project, "jar")

            modLoader = "neoforge"
            curseForgeId = project.curseforge_id.toInteger()

            optional('fancymenu')
            optional('bisecthosting-server-integration-menu-neoforge')
        }
    }
}

base {
    archivesName = "ftb-promoter"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.release.set(25) // Compile for Java 25
}

version = ashwing.utils().createNeoLikeVersion(project.minecraft_version, project.mod_version)
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

neoForge {
    version = project.mod_loader_version

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            programArguments.addAll('--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath)
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

sourceSets.main.resources { srcDir 'src/generated/client-resources' }

repositories {
    mavenCentral()
    mavenLocal()

    def repos = ashwing.repos(project)
    repos.ftb()
    repos.ftb(true, {
        it.includeGroup("net.rocketplatform.game.client.mod")
    })
    repos.curseMaven()
    repos.modmaven {
        it.includeGroup("mezz.jei")
    }
}

dependencies {
    implementation "curse.maven:bisecthosting-server-integration-menu-neoforge-1084468:${bisecthosting_version}"

    implementation "net.rocketplatform.game.client.mod:rgp-client:${ftb_worlds_version}-neoforge"
    runtimeOnly "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"

    implementation "curse.maven:fancymenu-367706:${fancy_menu_version}"

    // Deps
    runtimeOnly "curse.maven:konkrete-410295:${fancy_menu_konkrete_version}"
    runtimeOnly "curse.maven:melody-938643:${fancy_menu_melody_version}"
}

processResources {
    var replaceProperties = [
            mod_version: project.version,
            minecraft_version      : project.properties.minecraft_version,
            minecraft_version_range: project.properties.minecraft_version_range,
            neo_version            : project.properties.mod_loader_version,
            neo_version_range      : project.properties.mod_loader_version_range,
            loader_version_range   : project.properties.loader_version_range,
    ]

    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
